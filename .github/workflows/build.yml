name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk HuaweiOntReader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HuaweiOntReader-apk
          path: HuaweiOntReader.apk

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest HuaweiOntReader.apk \
            --title "قارئ ONT هواوي - آخر نسخة" \
            --notes "نزّل ملف HuaweiOntReader.apk وثبّته على الهاتف. (بناء رقم ${{ github.run_number }})"
